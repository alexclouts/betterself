[project]
name = "betterself"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.143.3",
    "passlib[argon2]>=1.7.4",
    "uvicorn[standard]",
    "pydantic-settings>=2.16.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.1.5",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betterself"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
