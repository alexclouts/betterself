name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    # Base PostgreSQL utilisée par les tests du backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: betterself
          POSTGRES_PASSWORD: betterself
          POSTGRES_DB: betterself_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betterself -d betterself_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://betterself:betterself@localhost:5432/betterself_test

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          # Doit correspondre à requires-python dans backend/pyproject.toml
          python-version: "3.14"

      - name: Installer uv
        uses: astral-sh/setup-uv@v3

      - name: Installer les dépendances
        working-directory: backend
        run: uv sync

      - name: Exécuter les tests
        working-directory: backend
        run: uv run pytest

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies
        working-directory: blog
        run: npm ci

      - name: Build Hugo
        working-directory: blog
        run: hugo --minify
